[package]
name = "xp-music"
version = "0.1.0"
description = "Reproductor de YouTube Music con estética Windows Media Player / XP"
authors = ["iznardo"]
edition = "2024"
publish = false

[lib]
# El sufijo `_lib` evita el choque de nombres entre lib y bin en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "xp_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
dirs = "7.0.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
rusqlite_migration = "2.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5"
ringbuf = "0.5"
crossbeam-channel = "0.5.17"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
ytmapi-rs = { version = "0.3.3", default-features = false, features = ["rustls", "simplified-queries"] }
tokio = { version = "1.54.0", features = ["sync", "time", "macros", "rt"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
rand = "0.9"
rustfft = "6.4.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[patch.crates-io]
ytmapi-rs = { path = "../vendor/ytmapi-rs" }

