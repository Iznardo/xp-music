[package]
name = "xp-music"
version = "1.1.0"
description = "YouTube Music player with a Windows Media Player / XP look"
authors = ["iznardo"]
license = "MIT"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids the lib/bin name clash on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "xp_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` (transparent window on macOS) must go with `app.macOSPrivateApi` in
# tauri.conf.json: tauri-build only checks `[dependencies]` and requires them to match on
# every platform. It has no effect outside macOS.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
dirs = "7.0.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
rusqlite_migration = "2.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5"
ringbuf = "0.5"
crossbeam-channel = "0.5.17"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
ytmapi-rs = { version = "0.3.3", default-features = false, features = ["rustls", "simplified-queries"] }
tokio = { version = "1.54.0", features = ["sync", "time", "macros", "rt"] }
rand = "0.9"
rustfft = "6.4.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
souvlaki = "0.8.3"
discord-rich-presence = "1.1.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
url = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[patch.crates-io]
ytmapi-rs = { path = "../vendor/ytmapi-rs" }

