<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">
  <!-- Icono original de XP Music: disco azul Luna con botón de reproducir naranja y nota musical. -->
  <defs>
    <radialGradient id="disc" cx="40%" cy="32%" r="75%">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="0.45" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#0b3a9c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset="1" stop-color="#5a8fd6"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#ff9d1a"/>
      <stop offset="1" stop-color="#d95d00"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be36b"/>
      <stop offset="1" stop-color="#2e8b16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#001640" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="120" cy="124" r="104" fill="url(#ring)"/>
    <circle cx="120" cy="124" r="96" fill="url(#disc)"/>
    <circle cx="120" cy="124" r="96" fill="none" stroke="#062a78" stroke-width="2" opacity="0.6"/>
  </g>
  <ellipse cx="112" cy="76" rx="70" ry="42" fill="url(#gloss)"/>
  <path d="M96 82 L96 166 L166 124 Z" fill="url(#play)" stroke="#8a3a00" stroke-width="4" stroke-linejoin="round"/>
  <path d="M104 96 L104 120 L140 110 Z" fill="#fff" opacity="0.45"/>
  <g filter="url(#shadow)">
    <path d="M206 120 L206 196" stroke="#1f5e0e" stroke-width="10" stroke-linecap="round"/>
    <path d="M206 120 Q236 132 236 156 Q226 140 206 140 Z" fill="url(#note)" stroke="#1f5e0e" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="190" cy="198" rx="22" ry="17" transform="rotate(-20 190 198)" fill="url(#note)" stroke="#1f5e0e" stroke-width="5"/>
    <path d="M206 120 L206 196" stroke="url(#note)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
