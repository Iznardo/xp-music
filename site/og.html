<!doctype html>
<!--
  Template of the social image (site/public/og.jpg, 1200×630). It is not part of the
  website. To regenerate it, open this file directly in the browser (file://, so the
  relative paths load) at 1200×630, take a screenshot and encode it with
  `ffmpeg -q:v 3`. It is in English: crawlers do not run the page's JavaScript.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        /* Sky veil behind the text: the clouds must not cross the letters. */
        background:
          radial-gradient(ellipse 600px 175px at 300px 150px, #1857dc 0%, rgb(24 87 220 / 0.9) 60%, rgb(24 87 220 / 0) 100%),
          url("src/desktop.svg") center 38% / cover;
        font-family: Tahoma, sans-serif;
      }
      .text {
        position: absolute;
        left: 64px;
        top: 46px;
        width: 470px;
        color: #fff;
        text-shadow: 0 2px 6px rgb(0 20 80 / 0.55);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand img {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 4px 8px rgb(0 20 80 / 0.5));
      }
      h1 {
        margin: 0;
        font: bold 76px/1 "Trebuchet MS", sans-serif;
        letter-spacing: -1px;
      }
      p {
        margin: 20px 0 0;
        font: bold 30px/1.3 "Trebuchet MS", sans-serif;
      }
      .tags {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .tags span {
        padding: 6px 14px;
        border: 1px solid rgb(255 255 255 / 0.7);
        border-radius: 16px;
        background: rgb(10 40 140 / 0.45);
        font-size: 19px;
        text-shadow: none;
      }
      /* The screenshot clipped to the window's real silhouette (outlinePath from
         src/lib/skin.ts for 1100×720, the screenshot size), with no added frame. */
      .shot {
        position: absolute;
        left: 552px;
        top: 158px;
        width: 1100px;
        height: 720px;
        transform: scale(0.58);
        transform-origin: 0 0;
        filter: drop-shadow(0 16px 26px rgb(0 0 0 / 0.5));
      }
      .shot img {
        display: block;
        clip-path: path("M 0 60 A 12 12 0 0 1 12 48 L 40 48 C 100 48 100 22 160 22 L 724 22 C 786 22 786 0 848 0 L 1088 0 A 12 12 0 0 1 1100 12 L 1100 694 L 496.48 694 A 18 18 0 0 0 481.82 701.55 A 44 44 0 0 1 446 720 L 148 720 A 40 40 0 0 1 108 680 C 108 605 0 605 0 530 Z");
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand">
        <img src="../src/assets/logo.webp" alt="" />
        <h1>XP Music</h1>
      </div>
      <p>YouTube Music with the look of Windows Media Player&nbsp;9</p>
      <div class="tags"><span>Windows</span><span>macOS</span><span>Linux</span><span>Free · MIT</span></div>
    </div>
    <div class="shot"><img src="../docs/now-playing.jpg" alt="" width="1100" height="720" /></div>
  </body>
</html>
