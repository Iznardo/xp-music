name: Build, test and gather one XP Music target
description: >-
  Installs dependencies, runs the checks (if `checks`), packages, tests the
  startup of the packages and gathers the release files of ONE target
  (system and architecture of the runner). With `tag` it also signs the
  updater artifacts (release); without it, it builds without keys (PR, push
  and dry run).

inputs:
  target:
    description: >-
      Target id (windows-x86_64, linux-aarch64, darwin-x86_64…);
      see scripts/release-targets.mjs
    required: true
  bundles:
    description: "Value of `tauri build --bundles`"
    required: true
  tag:
    description: "Draft tag for a release; empty on PR, push and dry run"
    required: false
    default: ""
  checks:
    description: >-
      "true" runs `npm run check` (svelte-check, rustfmt, Clippy and tests);
      one target per system is enough
    required: false
    default: "false"
  updater-pubkey:
    description: "Updater public key (release only)"
    required: false
    default: ""
  signing-key:
    description: "TAURI_SIGNING_PRIVATE_KEY, the updater key (release only)"
    required: false
    default: ""
  signing-key-password:
    description: "Password of the updater key (release only)"
    required: false
    default: ""
  windows-thumbprint:
    description: "Thumbprint of the local Authenticode certificate (Windows)"
    required: false
    default: ""
  apple-certificate:
    description: "Developer ID .p12 certificate in base64 (optional, macOS)"
    required: false
    default: ""
  apple-certificate-password:
    description: "Password of the .p12 (optional)"
    required: false
    default: ""
  apple-signing-identity:
    description: "Identity, e.g. \"Developer ID Application: …\" (optional)"
    required: false
    default: ""
  apple-id:
    description: "Apple ID for notarization (optional)"
    required: false
    default: ""
  apple-password:
    description: "App-specific password for notarization (optional)"
    required: false
    default: ""
  apple-team-id:
    description: "Team ID for notarization (optional)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    # stable
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev patchelf libasound2-dev libdbus-1-dev libssl-dev \
          xvfb xauth xdotool dbus-x11 openbox gnome-keyring \
          pulseaudio libasound2-plugins
    # Rust build cache only outside releases: what gets signed and published is
    # always built from scratch. Only `main` saves it; PRs read it.
    # Swatinem/rust-cache v2.9.2
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      if: inputs.tag == ''
      with:
        workspaces: src-tauri -> target
        key: ${{ inputs.target }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Dependencies
      shell: bash
      run: |
        npm ci
        npm run fetch-tools
    - name: Checks
      if: inputs.checks == 'true'
      shell: bash
      run: npm run check

    # Windows (x64 and ARM64): the maintainer signs the installer locally and
    # here it is only reused byte for byte.
    - name: Fetch the Windows installer with its local signature
      if: inputs.tag != '' && startsWith(inputs.target, 'windows-')
      # actions/download-artifact v8.0.2. Uploaded by `validate`, the only job
      # allowed to see the draft.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: draft-${{ inputs.target }}
        path: src-tauri/target/release/bundle/nsis
    - name: Verify Authenticode without changing the Windows certificate
      if: inputs.tag != '' && startsWith(inputs.target, 'windows-')
      shell: pwsh
      env:
        WINDOWS_SIGNING_THUMBPRINT: ${{ inputs.windows-thumbprint }}
      run: |
        $ErrorActionPreference = 'Stop'
        $expected = $env:WINDOWS_SIGNING_THUMBPRINT
        if (-not $expected) { throw 'WINDOWS_SIGNING_THUMBPRINT is missing.' }
        $bundle = 'src-tauri/target/release/bundle/nsis'
        $files = @(Get-ChildItem "$bundle/*-setup.exe")
        if ($files.Count -ne 1) { throw 'There must be one Windows installer.' }
        $file = $files[0].FullName
        $signature = Get-AuthenticodeSignature $file
        if ($signature.SignerCertificate.Thumbprint -ne $expected) {
          throw 'The installer does not use the expected Windows certificate.'
        }
        # Trust only the pinned thumbprint and only on this ephemeral runner.
        $type = 'System.Security.Cryptography.X509Certificates.X509Store'
        $store = New-Object -TypeName $type -ArgumentList 'Root','CurrentUser'
        $store.Open('ReadWrite')
        try { $store.Add($signature.SignerCertificate) }
        finally { $store.Close() }
        if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') {
          throw 'Invalid Authenticode signature.'
        }

    # Everything else is built here.
    - name: Package
      if: inputs.tag == '' || !startsWith(inputs.target, 'windows-')
      shell: bash
      env:
        BUNDLES: ${{ inputs.bundles }}
        TAG: ${{ inputs.tag }}
        TARGET: ${{ inputs.target }}
        NO_STRIP: "true"
        XP_MUSIC_UPDATER_PUBKEY: ${{ inputs.updater-pubkey }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-key-password }}
        APPLE_CERTIFICATE: ${{ inputs.apple-certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple-certificate-password }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.apple-signing-identity }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_PASSWORD: ${{ inputs.apple-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: |
        args=(--bundles "$BUNDLES")
        # macOS is experimental and has no updater (ad hoc signing): no key.
        if [ -n "$TAG" ] && [[ "$TARGET" != darwin-* ]]; then
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$XP_MUSIC_UPDATER_PUBKEY"
          # The bundler checks the signature with the public key in the config.
          node -e '
            const fs = require("node:fs");
            const config = {
              bundle: { createUpdaterArtifacts: true },
              plugins: {
                updater: { pubkey: process.env.XP_MUSIC_UPDATER_PUBKEY }
              }
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + "/updater.json",
              JSON.stringify(config));
          '
          args+=(--config "$RUNNER_TEMP/updater.json")
        else
          unset XP_MUSIC_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        fi
        # Without a complete Apple certificate, macOS stays ad hoc signed.
        if [ -z "$TAG" ] || [ -z "$APPLE_CERTIFICATE" ] ||
           [ -z "$APPLE_SIGNING_IDENTITY" ]; then
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
        fi
        # Without notarization credentials, it is only signed.
        if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] ||
           [ -z "${APPLE_TEAM_ID:-}" ]; then
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
        fi
        npm run tauri build -- "${args[@]}"

    - name: Gather the release files
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        TAG: ${{ inputs.tag }}
      run: |
        node scripts/collect-artifacts.mjs "$TARGET" \
          src-tauri/target/release/bundle release-files ${TAG:+--signed}

    # Smoke tests on the gathered files (exactly what gets published).
    - name: Test Linux packages outside the repository
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo dpkg -i release-files/*.deb
        xvfb-run -a dbus-run-session -- \
          bash scripts/smoke-linux.sh /usr/bin/xp-music
        for package in release-files/*.AppImage; do
          chmod +x "$package"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- \
            bash scripts/smoke-linux.sh "$package"
        done
        bash scripts/smoke-linux-rpm.sh release-files/*.rpm
    - name: Test the Windows installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = @(Get-ChildItem 'release-files/*-setup.exe')
        if ($installer.Count -ne 1) { throw 'There must be one installer.' }
        $dir = Join-Path $env:RUNNER_TEMP 'xp-music-smoke'
        # /S is silent; /D must be the last argument, without quotes.
        $process = Start-Process -Wait -PassThru `
          -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$dir"
        if ($process.ExitCode -ne 0) {
          throw "The installer exited with $($process.ExitCode)."
        }
        $exe = Get-ChildItem $dir -Filter *.exe |
          Where-Object { $_.Name -notlike 'uninstall*' } |
          Select-Object -First 1
        if (-not $exe) { throw "The app was not installed in $dir." }
        node scripts/smoke-desktop.mjs $exe.FullName
        if ($LASTEXITCODE -ne 0) { throw 'Smoke test failed.' }
    - name: Test the macOS .dmg
      if: runner.os == 'macOS'
      shell: bash
      run: |
        mount=$(mktemp -d)
        hdiutil attach release-files/*.dmg -nobrowse -readonly \
          -mountpoint "$mount"
        app="$RUNNER_TEMP/XP Music.app"
        ditto "$mount/XP Music.app" "$app"
        hdiutil detach "$mount"
        codesign --verify --deep --strict --verbose=2 "$app"
        binary=$(find "$app/Contents/MacOS" -type f | head -1)
        node scripts/smoke-desktop.mjs "$binary"

    # actions/upload-artifact v7.0.2
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.target }}
        path: release-files/*
        if-no-files-found: error
        retention-days: 7
