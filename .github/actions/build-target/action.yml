name: Compilar, probar y reunir un target de XP Music
description: >-
  Instala dependencias, ejecuta las comprobaciones, empaqueta, prueba el
  arranque de los paquetes y reúne los archivos de release de UN target
  (sistema y arquitectura del runner). Con `tag` firma además los artefactos
  del updater (release); sin él compila sin claves (PR, push y dry run).

inputs:
  target:
    description: >-
      Id del target (windows-x86_64, linux-aarch64, darwin-x86_64…);
      ver scripts/release-targets.mjs
    required: true
  bundles:
    description: "Valor de `tauri build --bundles`"
    required: true
  tag:
    description: "Tag del draft si es release; vacío en PR, push y dry run"
    required: false
    default: ""
  updater-pubkey:
    description: "Clave pública del updater (solo release)"
    required: false
    default: ""
  signing-key:
    description: "TAURI_SIGNING_PRIVATE_KEY, clave del updater (solo release)"
    required: false
    default: ""
  signing-key-password:
    description: "Contraseña de la clave del updater (solo release)"
    required: false
    default: ""
  windows-thumbprint:
    description: "Huella del certificado Authenticode local (Windows x64)"
    required: false
    default: ""
  apple-certificate:
    description: "Certificado Developer ID .p12 en base64 (opcional, macOS)"
    required: false
    default: ""
  apple-certificate-password:
    description: "Contraseña del .p12 (opcional)"
    required: false
    default: ""
  apple-signing-identity:
    description: "Identidad, p. ej. «Developer ID Application: …» (opcional)"
    required: false
    default: ""
  apple-id:
    description: "Apple ID para notarizar (opcional)"
    required: false
    default: ""
  apple-password:
    description: "Contraseña específica de app para notarizar (opcional)"
    required: false
    default: ""
  apple-team-id:
    description: "Team ID para notarizar (opcional)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    # stable
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
    - name: Dependencias Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev patchelf libasound2-dev libdbus-1-dev libssl-dev \
          xvfb xauth xdotool dbus-x11 openbox gnome-keyring \
          pulseaudio libasound2-plugins
    - name: Dependencias y comprobaciones
      shell: bash
      run: |
        npm ci
        npm run fetch-tools
        npm run check

    # Windows x64: el instalador lo firma el mantenedor en local y aquí
    # solo se reutiliza byte a byte.
    - name: Recuperar el instalador Windows con su firma local
      if: inputs.tag != '' && inputs.target == 'windows-x86_64'
      # actions/download-artifact v8.0.2. Lo sube `validate`, el único job
      # con permiso para ver el draft.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: draft-windows-x86_64
        path: src-tauri/target/release/bundle/nsis
    - name: Verificar Authenticode sin cambiar el certificado de Windows
      if: inputs.tag != '' && inputs.target == 'windows-x86_64'
      shell: pwsh
      env:
        WINDOWS_SIGNING_THUMBPRINT: ${{ inputs.windows-thumbprint }}
      run: |
        $ErrorActionPreference = 'Stop'
        $expected = $env:WINDOWS_SIGNING_THUMBPRINT
        if (-not $expected) { throw 'Falta WINDOWS_SIGNING_THUMBPRINT.' }
        $bundle = 'src-tauri/target/release/bundle/nsis'
        $files = @(Get-ChildItem "$bundle/*-setup.exe")
        if ($files.Count -ne 1) { throw 'Debe haber un instalador Windows.' }
        $file = $files[0].FullName
        $signature = Get-AuthenticodeSignature $file
        if ($signature.SignerCertificate.Thumbprint -ne $expected) {
          throw 'El instalador no usa el certificado Windows esperado.'
        }
        # Confiar solo en la huella fijada y solo en este runner efímero.
        $type = 'System.Security.Cryptography.X509Certificates.X509Store'
        $store = New-Object -TypeName $type -ArgumentList 'Root','CurrentUser'
        $store.Open('ReadWrite')
        try { $store.Add($signature.SignerCertificate) }
        finally { $store.Close() }
        if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') {
          throw 'Firma Authenticode no válida.'
        }

    # Todo lo demás se compila aquí.
    - name: Empaquetar
      if: inputs.tag == '' || inputs.target != 'windows-x86_64'
      shell: bash
      env:
        BUNDLES: ${{ inputs.bundles }}
        TAG: ${{ inputs.tag }}
        TARGET: ${{ inputs.target }}
        NO_STRIP: "true"
        XP_MUSIC_UPDATER_PUBKEY: ${{ inputs.updater-pubkey }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-key-password }}
        APPLE_CERTIFICATE: ${{ inputs.apple-certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple-certificate-password }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.apple-signing-identity }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_PASSWORD: ${{ inputs.apple-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: |
        args=(--bundles "$BUNDLES")
        # macOS es experimental y sin updater (firma ad hoc): no usa la clave.
        if [ -n "$TAG" ] && [[ "$TARGET" != darwin-* ]]; then
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$XP_MUSIC_UPDATER_PUBKEY"
          # El bundler comprueba la firma con la clave pública de la config.
          node -e '
            const fs = require("node:fs");
            const config = {
              bundle: { createUpdaterArtifacts: true },
              plugins: {
                updater: { pubkey: process.env.XP_MUSIC_UPDATER_PUBKEY }
              }
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + "/updater.json",
              JSON.stringify(config));
          '
          args+=(--config "$RUNNER_TEMP/updater.json")
        else
          unset XP_MUSIC_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        fi
        # Sin certificado de Apple completo, macOS queda con firma ad hoc.
        if [ -z "$TAG" ] || [ -z "$APPLE_CERTIFICATE" ] ||
           [ -z "$APPLE_SIGNING_IDENTITY" ]; then
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
        fi
        # Sin credenciales de notarización, solo se firma.
        if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] ||
           [ -z "${APPLE_TEAM_ID:-}" ]; then
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
        fi
        npm run tauri build -- "${args[@]}"

    - name: Reunir los archivos de la release
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        TAG: ${{ inputs.tag }}
      run: |
        node scripts/collect-artifacts.mjs "$TARGET" \
          src-tauri/target/release/bundle release-files ${TAG:+--signed}

    # Smoke tests sobre los archivos reunidos (lo mismo que se publica).
    - name: Probar paquetes Linux fuera del repositorio
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo dpkg -i release-files/*.deb
        xvfb-run -a dbus-run-session -- \
          bash scripts/smoke-linux.sh /usr/bin/xp-music
        for package in release-files/*.AppImage; do
          chmod +x "$package"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- \
            bash scripts/smoke-linux.sh "$package"
        done
        bash scripts/smoke-linux-rpm.sh release-files/*.rpm
    - name: Probar el instalador de Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = @(Get-ChildItem 'release-files/*-setup.exe')
        if ($installer.Count -ne 1) { throw 'Debe haber un instalador.' }
        $dir = Join-Path $env:RUNNER_TEMP 'xp-music-smoke'
        # /S silencioso; /D debe ser el último argumento y sin comillas.
        $process = Start-Process -Wait -PassThru `
          -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$dir"
        if ($process.ExitCode -ne 0) {
          throw "El instalador salió con $($process.ExitCode)."
        }
        $exe = Get-ChildItem $dir -Filter *.exe |
          Where-Object { $_.Name -notlike 'uninstall*' } |
          Select-Object -First 1
        if (-not $exe) { throw "No se instaló la app en $dir." }
        node scripts/smoke-desktop.mjs $exe.FullName
        if ($LASTEXITCODE -ne 0) { throw 'Smoke test fallido.' }
    - name: Probar el .dmg de macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        mount=$(mktemp -d)
        hdiutil attach release-files/*.dmg -nobrowse -readonly \
          -mountpoint "$mount"
        app="$RUNNER_TEMP/XP Music.app"
        ditto "$mount/XP Music.app" "$app"
        hdiutil detach "$mount"
        codesign --verify --deep --strict --verbose=2 "$app"
        binary=$(find "$app/Contents/MacOS" -type f | head -1)
        node scripts/smoke-desktop.mjs "$binary"

    # actions/upload-artifact v7.0.2
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ inputs.target }}
        path: release-files/*
        if-no-files-found: error
        retention-days: 7
