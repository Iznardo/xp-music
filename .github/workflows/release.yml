name: Desktop (Windows, Linux and macOS)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag of the draft prepared with npm run release (v1.0.3).
          Empty: dry run, builds and tests everything but publishes nothing.
        required: false
        type: string

permissions:
  contents: read

# One publication at a time; checks and dry runs do not block it.
concurrency:
  group: >-
    desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' &&
    'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    # Before touching any key: it only does something when publishing a release.
    # Drafts are only visible to a token with write permission, so this is the
    # only earlier job with `contents: write`. It runs no repository code
    # except inline `node -e`; the build jobs, which do run dependencies and
    # carry the keys, stay read-only.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.tag != ''
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: inputs.tag != ''
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          XP_MUSIC_UPDATER_PUBKEY: ${{ vars.XP_MUSIC_UPDATER_PUBKEY }}
        run: |
          test "$GH_REPO" = Iznardo/xp-music
          test -n "$XP_MUSIC_UPDATER_PUBKEY"
          # shellcheck disable=SC2016  # the templates are JavaScript
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const version = pkg.version;
            assert.match(version, /^\d+\.\d+\.\d+$/);
            assert.equal(process.env.TAG, `v${version}`);
          '
          git merge-base --is-ancestor HEAD origin/main
          # `releases/tags/<tag>` does not return drafts: search the list instead.
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\")" \
            | sed -n 1p > "$RUNNER_TEMP/release.json"
          test -s "$RUNNER_TEMP/release.json"
          node -e '
            const assert = require("node:assert/strict");
            const release = require(process.env.RUNNER_TEMP + "/release.json");
            assert.equal(release.draft, true, "The release must be a draft");
            assert.equal(release.prerelease, false);
          '
      - name: Gather the Windows installers signed locally
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          for arch in x64 arm64; do
            mkdir "draft-$arch"
            gh release download "$TAG" --dir "draft-$arch" \
              --pattern "*_${version}_${arch}-setup.exe" \
              --pattern "*_${version}_${arch}-setup.exe.sig"
            test "$(find "draft-$arch" -type f | wc -l)" -eq 2
          done
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.tag != ''
        with:
          name: draft-windows-x86_64
          path: draft-x64/*
          if-no-files-found: error
          retention-days: 1
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.tag != ''
        with:
          name: draft-windows-aarch64
          path: draft-arm64/*
          if-no-files-found: error
          retention-days: 1

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels for public repositories (GitHub docs):
          # windows-11-arm, ubuntu-24.04-arm and macos-15-intel exist
          # since 2025.
          # checks: `npm run check` on one target per system (#[cfg] code
          # changes by OS, not by architecture); the rest only package and
          # test startup.
          - target: windows-x86_64
            os: windows-2022
            bundles: nsis
            checks: true
          - target: windows-aarch64
            os: windows-11-arm
            bundles: nsis
          - target: linux-x86_64
            os: ubuntu-24.04
            bundles: deb,appimage,rpm
            checks: true
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            bundles: deb,appimage,rpm
          - target: darwin-x86_64
            os: macos-15-intel
            bundles: app,dmg
          - target: darwin-aarch64
            os: macos-15
            bundles: app,dmg
            checks: true
    runs-on: ${{ matrix.os }}
    # The updater key and the Apple certificates only exist in the `release`
    # environment, which requires the maintainer's approval. Only the Linux and
    # macOS jobs use it when publishing; Windows arrives already signed.
    environment: >-
      ${{ inputs.tag && !startsWith(matrix.target, 'windows-') && 'release' ||
      '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) ||
            github.sha }}
          persist-credentials: false
      # Secrets are only passed when publishing a release, never on PRs,
      # pushes or dry runs.
      - uses: ./.github/actions/build-target
        with:
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          tag: ${{ inputs.tag }}
          checks: ${{ matrix.checks || false }}
          updater-pubkey: ${{ inputs.tag && vars.XP_MUSIC_UPDATER_PUBKEY }}
          # Only Linux signs in CI: Windows is signed locally and macOS has no
          # updater (experimental).
          signing-key: >-
            ${{ inputs.tag && startsWith(matrix.target, 'linux-') &&
            secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-key-password: >-
            ${{ inputs.tag && startsWith(matrix.target, 'linux-') &&
            secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          windows-thumbprint: >-
            ${{ inputs.tag && vars.WINDOWS_SIGNING_THUMBPRINT }}
          apple-certificate: ${{ inputs.tag && secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: >-
            ${{ inputs.tag && secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-identity: >-
            ${{ inputs.tag && secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ inputs.tag && secrets.APPLE_ID }}
          apple-password: ${{ inputs.tag && secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ inputs.tag && secrets.APPLE_TEAM_ID }}

  nix:
    # Checks the flake on PRs; not part of the release.
    if: inputs.tag == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cachix/install-nix-action v31.11.3
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - run: nix build .#xp-music -L
      - run: nix develop -c cargo --version

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      # One artifact per target; file names do not repeat.
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: packages
          merge-multiple: true
      - name: Verify every updater signature
        env:
          XP_MUSIC_UPDATER_PUBKEY: ${{ vars.XP_MUSIC_UPDATER_PUBKEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          printf '%s' "$XP_MUSIC_UPDATER_PUBKEY" | base64 --decode \
            > "$RUNNER_TEMP/updater.pub"
          mapfile -d '' signatures < <(
            find packages -type f -name '*.sig' -print0
          )
          expected=$(node scripts/release-targets.mjs signed-count)
          test "${#signatures[@]}" -eq "$expected"
          for signature in "${signatures[@]}"; do
            base64 --decode "$signature" > "$RUNNER_TEMP/artifact.sig"
            minisign -Vm "${signature%.sig}" \
              -x "$RUNNER_TEMP/artifact.sig" -p "$RUNNER_TEMP/updater.pub"
          done
      - name: Complete the notes and manifest, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # `releases/tags/<tag>` does not return drafts: search the list instead.
          find_release() {
            gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\")" | sed -n 1p
          }
          find_release > "$RUNNER_TEMP/release.json"
          test -s "$RUNNER_TEMP/release.json"
          # If someone published during the build, do not modify that release.
          node -e '
            const release = require(process.env.RUNNER_TEMP + "/release.json");
            if (!release.draft) process.exit(1);
          '
          # The Windows installers (x64 and ARM64) are already in the draft,
          # signed locally: they are not uploaded again.
          mapfile -d '' uploads < <(
            find packages -type f ! -name '*-setup.exe' \
              ! -name '*-setup.exe.sig' -print0
          )
          gh release upload "$TAG" "${uploads[@]}" --clobber
          find_release > "$RUNNER_TEMP/release.json"
          release_id=$(node -p \
            'require(process.env.RUNNER_TEMP + "/release.json").id')
          # Download table (idempotent) above the maintainer's notes.
          node scripts/release-notes.mjs \
            "$RUNNER_TEMP/release.json" packages "$RUNNER_TEMP/notes.md"
          # A PATCH of a draft without `tag_name` unlinks it from the tag
          # (it becomes `untagged-<hash>`): repeat it on every PATCH.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f "tag_name=$TAG" -F "body=@$RUNNER_TEMP/notes.md" --silent
          # The manifest only carries the maintainer's notes.
          node scripts/update-manifest.mjs \
            "$RUNNER_TEMP/release.json" packages "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
          # GitHub picks latest by date/semver, not by build order.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f "tag_name=$TAG" -F draft=false -f make_latest=legacy --silent
