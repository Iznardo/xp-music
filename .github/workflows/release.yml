name: Desktop (Windows, Linux y macOS)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag del draft preparado con npm run release (v1.0.3).
          Vacío: dry run, compila y prueba todo pero no publica nada.
        required: false
        type: string

permissions:
  contents: read

# Una sola publicación a la vez; los checks y los dry run no la bloquean.
concurrency:
  group: >-
    desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' &&
    'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    # Antes de tocar ninguna clave: solo hace algo al publicar una release.
    # Los drafts solo los ve un token con permiso de escritura, así que este
    # es el único job previo con `contents: write`. No ejecuta código del
    # repositorio salvo `node -e` en línea; los jobs de compilación, que sí
    # ejecutan dependencias y llevan las claves, siguen en solo lectura.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.tag != ''
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: inputs.tag != ''
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validar la release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          XP_MUSIC_UPDATER_PUBKEY: ${{ vars.XP_MUSIC_UPDATER_PUBKEY }}
        run: |
          test "$GH_REPO" = Iznardo/xp-music
          test -n "$XP_MUSIC_UPDATER_PUBKEY"
          # shellcheck disable=SC2016  # las plantillas son de JavaScript
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const version = pkg.version;
            assert.match(version, /^\d+\.\d+\.\d+$/);
            assert.equal(process.env.TAG, `v${version}`);
          '
          git merge-base --is-ancestor HEAD origin/main
          # `releases/tags/<tag>` no devuelve drafts: se busca en la lista.
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\")" \
            | sed -n 1p > "$RUNNER_TEMP/release.json"
          test -s "$RUNNER_TEMP/release.json"
          node -e '
            const assert = require("node:assert/strict");
            const release = require(process.env.RUNNER_TEMP + "/release.json");
            assert.equal(release.draft, true, "The release must be a draft");
            assert.equal(release.prerelease, false);
          '
      - name: Reunir los instaladores Windows firmados en local
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          for arch in x64 arm64; do
            mkdir "draft-$arch"
            gh release download "$TAG" --dir "draft-$arch" \
              --pattern "*_${version}_${arch}-setup.exe" \
              --pattern "*_${version}_${arch}-setup.exe.sig"
            test "$(find "draft-$arch" -type f | wc -l)" -eq 2
          done
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.tag != ''
        with:
          name: draft-windows-x86_64
          path: draft-x64/*
          if-no-files-found: error
          retention-days: 1
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.tag != ''
        with:
          name: draft-windows-aarch64
          path: draft-arm64/*
          if-no-files-found: error
          retention-days: 1

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Etiquetas de runner de repositorios públicos (docs de GitHub):
          # windows-11-arm, ubuntu-24.04-arm y macos-15-intel existen
          # desde 2025.
          # checks: `npm run check` en un target por sistema (el código con
          # #[cfg] cambia por SO, no por arquitectura); el resto solo empaqueta
          # y prueba el arranque.
          - target: windows-x86_64
            os: windows-2022
            bundles: nsis
            checks: true
          - target: windows-aarch64
            os: windows-11-arm
            bundles: nsis
          - target: linux-x86_64
            os: ubuntu-24.04
            bundles: deb,appimage,rpm
            checks: true
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            bundles: deb,appimage,rpm
          - target: darwin-x86_64
            os: macos-15-intel
            bundles: app,dmg
          - target: darwin-aarch64
            os: macos-15
            bundles: app,dmg
            checks: true
    runs-on: ${{ matrix.os }}
    # La clave del updater y los certificados de Apple solo existen en el
    # environment `release`, que exige la aprobación del mantenedor. Solo lo
    # usan los jobs de Linux y macOS al publicar; Windows llega ya firmado.
    environment: >-
      ${{ inputs.tag && !startsWith(matrix.target, 'windows-') && 'release' ||
      '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) ||
            github.sha }}
          persist-credentials: false
      # Los secretos solo se pasan al publicar una release, nunca en PR,
      # push ni dry run.
      - uses: ./.github/actions/build-target
        with:
          target: ${{ matrix.target }}
          bundles: ${{ matrix.bundles }}
          tag: ${{ inputs.tag }}
          checks: ${{ matrix.checks || false }}
          updater-pubkey: ${{ inputs.tag && vars.XP_MUSIC_UPDATER_PUBKEY }}
          # Solo Linux firma en CI: Windows se firma en local y macOS no tiene
          # updater (experimental).
          signing-key: >-
            ${{ inputs.tag && startsWith(matrix.target, 'linux-') &&
            secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-key-password: >-
            ${{ inputs.tag && startsWith(matrix.target, 'linux-') &&
            secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          windows-thumbprint: >-
            ${{ inputs.tag && vars.WINDOWS_SIGNING_THUMBPRINT }}
          apple-certificate: ${{ inputs.tag && secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: >-
            ${{ inputs.tag && secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-identity: >-
            ${{ inputs.tag && secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ inputs.tag && secrets.APPLE_ID }}
          apple-password: ${{ inputs.tag && secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ inputs.tag && secrets.APPLE_TEAM_ID }}

  nix:
    # Comprueba el flake en los PR; no forma parte de la publicación.
    if: inputs.tag == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cachix/install-nix-action v31.11.3
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - run: nix build .#xp-music -L
      - run: nix develop -c cargo --version

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      # Un artefacto por target; los nombres de archivo no se repiten.
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: packages
          merge-multiple: true
      - name: Verificar todas las firmas del updater
        env:
          XP_MUSIC_UPDATER_PUBKEY: ${{ vars.XP_MUSIC_UPDATER_PUBKEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          printf '%s' "$XP_MUSIC_UPDATER_PUBKEY" | base64 --decode \
            > "$RUNNER_TEMP/updater.pub"
          mapfile -d '' signatures < <(
            find packages -type f -name '*.sig' -print0
          )
          expected=$(node scripts/release-targets.mjs signed-count)
          test "${#signatures[@]}" -eq "$expected"
          for signature in "${signatures[@]}"; do
            base64 --decode "$signature" > "$RUNNER_TEMP/artifact.sig"
            minisign -Vm "${signature%.sig}" \
              -x "$RUNNER_TEMP/artifact.sig" -p "$RUNNER_TEMP/updater.pub"
          done
      - name: Completar notas y manifiesto, y publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # `releases/tags/<tag>` no devuelve drafts: se busca en la lista.
          find_release() {
            gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\")" | sed -n 1p
          }
          find_release > "$RUNNER_TEMP/release.json"
          test -s "$RUNNER_TEMP/release.json"
          # Si alguien publicó durante el build, no modificar esa release.
          node -e '
            const release = require(process.env.RUNNER_TEMP + "/release.json");
            if (!release.draft) process.exit(1);
          '
          # Los instaladores Windows (x64 y ARM64) ya están en el draft,
          # firmados en local: no se vuelven a subir.
          mapfile -d '' uploads < <(
            find packages -type f ! -name '*-setup.exe' \
              ! -name '*-setup.exe.sig' -print0
          )
          gh release upload "$TAG" "${uploads[@]}" --clobber
          find_release > "$RUNNER_TEMP/release.json"
          release_id=$(node -p \
            'require(process.env.RUNNER_TEMP + "/release.json").id')
          # Tabla de descargas (idempotente) sobre las notas del mantenedor.
          node scripts/release-notes.mjs \
            "$RUNNER_TEMP/release.json" packages "$RUNNER_TEMP/notes.md"
          # Un PATCH de un draft sin `tag_name` lo desvincula del tag
          # (pasa a `untagged-<hash>`): hay que repetirlo en cada PATCH.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f "tag_name=$TAG" -F "body=@$RUNNER_TEMP/notes.md" --silent
          # El manifiesto solo lleva las notas del mantenedor.
          node scripts/update-manifest.mjs \
            "$RUNNER_TEMP/release.json" packages "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
          # GitHub elige latest por fecha/semver, no por orden de los builds.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f "tag_name=$TAG" -F draft=false -f make_latest=legacy --silent
