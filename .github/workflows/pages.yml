# Project website (site/) with the documentation from docs/, on GitHub Pages.
# Needs once: Settings → Pages → Source: "GitHub Actions".
# On PRs it only builds (without deploying), so a change cannot break the site.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      # What the website reuses from the app.
      - "src/styles/**"
      - "src/lib/skin.ts"
      - "src/lib/locale.ts"
      - "src/lib/locales/**"
      - "src/lib/viz/**"
      - "src/lib/components/xp/**"
      - "src/assets/**"
      - "src-tauri/icons/32x32.png"
      - "src-tauri/icons/128x128@2x.png"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      # What the website reuses from the app.
      - "src/styles/**"
      - "src/lib/skin.ts"
      - "src/lib/strings.ts"
      - "src/lib/viz/**"
      - "src/lib/components/xp/**"
      - "src/assets/**"
      - "src-tauri/icons/32x32.png"
      - "src-tauri/icons/128x128@2x.png"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deployments go one at a time; PR builds do not wait for them.
  group: >-
    pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run site:build
      # configure-pages v6.0.0
      - if: github.event_name != 'pull_request'
        uses:
          actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # upload-pages-artifact v5.0.0
      - if: github.event_name != 'pull_request'
        uses:
          actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages v5.0.1
      - id: deployment
        uses:
          actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
