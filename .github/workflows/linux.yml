name: Linux

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release existente a compilar (por ejemplo v1.0.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: >-
            ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libdbus-1-dev libssl-dev \
            xvfb xauth xdotool dbus-x11 openbox gnome-keyring \
            pulseaudio libasound2-plugins
      - run: npm ci
      - run: npm run fetch-tools
      - run: npm run check
      - name: Empaquetar .deb y AppImage
        run: npm run tauri build -- --bundles deb,appimage
        env:
          NO_STRIP: "true"
      - name: Probar los paquetes fuera del repositorio
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          xvfb-run -a dbus-run-session -- \
            bash scripts/smoke-linux.sh /usr/bin/xp-music
          for package in src-tauri/target/release/bundle/appimage/*.AppImage
          do
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- \
              bash scripts/smoke-linux.sh "$package"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-x86_64
          path: packages
      - name: Adjuntar binarios a la release existente
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$TAG"
          mapfile -t files < <(
            find packages -type f \( -name '*.deb' -o -name '*.AppImage' \)
          )
          test "${#files[@]}" -eq 2
          gh release upload "$TAG" "${files[@]}" --clobber
